name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site
        run: |
          node scripts/check-site.mjs
          node --test tests/contact-directions.test.mjs
          node --test tests/estimate-request-workflow.test.mjs
          node --test tests/home-conversion.test.mjs
          node --test tests/mechanical-journey.test.mjs
          node --test tests/navigation-shell.test.mjs
          node --test tests/supabase-integration.test.mjs
          node --check assets/js/main.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4