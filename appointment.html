<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Request an appointment with Amador Auto Care."><title>Request an Appointment | Amador Auto Care</title><link rel="stylesheet" href="assets/css/styles.css"><script src="assets/js/supabase-config.js"></script><script src="assets/js/main.js" defer></script></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><header class="site-header"><a class="brand" href="index.html">Amador Auto Care</a><a href="contact.html">Contact</a></header><main id="main-content"><header class="page-header"><p class="eyebrow">Pending staff confirmation</p><h1>Request an appointment</h1><p>A preferred date is not booked until staff confirms it.</p></header><div class="page-content"><form class="request-form" data-service-request-form data-request-type="appointment"><div class="form-row"><div class="form-field"><label for="appointment-name">Name</label><input id="appointment-name" name="name" autocomplete="name" required></div><div class="form-field"><label for="appointment-phone">Phone</label><input id="appointment-phone" name="phone" type="tel" autocomplete="tel" required></div></div><div class="form-row"><div class="form-field"><label for="appointment-vehicle">Vehicle year, make, and model</label><input id="appointment-vehicle" name="vehicle" required></div><div class="form-field"><label for="appointment-date">Preferred date</label><input id="appointment-date" name="date" type="date" required></div></div><div class="form-field"><label for="appointment-service">Service needed</label><textarea id="appointment-service" name="service" required></textarea></div><p class="form-notice">Sending a request does not create an appointment. Staff confirmation is required.</p><input class="honeypot" name="website" type="text" autocomplete="off" tabindex="-1" aria-hidden="true"><button class="button button--primary" type="submit">Send appointment request</button><div class="form-status" data-form-status role="status" aria-live="polite"></div></form></div></main><footer class="site-footer"><p><strong>Amador Auto Care</strong></p><a href="privacy.html">Privacy</a></footer></body></html>
