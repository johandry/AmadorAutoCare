<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Solicite un presupuesto de Amador Auto Care."><title>Solicitar presupuesto | Amador Auto Care</title><link rel="stylesheet" href="../assets/css/styles.css"><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/main.js?v=20260907-2" defer></script></head><body><a class="skip-link" href="#main-content">Saltar al contenido principal</a><header class="site-header"><a class="brand" href="index.html">Amador Auto Care</a><a class="language-link" lang="en" hreflang="en" href="../estimate.html">English</a></header><main id="main-content"><header class="page-header"><h1>Solicitar presupuesto</h1><p>Una solicitud no es un diagnostico ni un presupuesto final.</p></header><div class="page-content"><form class="request-form" data-service-request-form data-request-type="estimate" novalidate><p class="form-field"><label for="name">Nombre</label><input id="name" name="name" required></p><p class="form-field"><label for="email">Correo electronico</label><input id="email" name="email" type="email" required></p><p class="form-field"><label for="vehicle">Ano, marca y modelo</label><input id="vehicle" name="vehicle" required></p><p class="form-field"><label for="category">Categoria de servicio</label><select id="category" name="category" required><option value="">Seleccione una opcion</option><option>Mechanical</option><option>Body or collision</option><option>Not sure</option></select></p><fieldset class="form-field"><legend>Contacto preferido</legend><label><input type="radio" name="preferredContact" value="Phone" required> Telefono</label><label><input type="radio" name="preferredContact" value="Email"> Correo</label></fieldset><fieldset class="form-field"><legend>Es seguro conducir el vehiculo?</legend><label><input type="radio" name="safeToDrive" value="Yes" required> Si</label><label><input type="radio" name="safeToDrive" value="No"> No</label><label><input type="radio" name="safeToDrive" value="Not sure"> No estoy seguro</label></fieldset><p class="form-field"><label for="description">Que sucede?</label><textarea id="description" name="description" required></textarea></p><input class="honeypot" name="website" type="text" tabindex="-1" aria-hidden="true"><button class="button button--primary" type="submit">Enviar solicitud</button><div class="form-status" data-form-status role="status" aria-live="polite"></div></form></div></main><footer class="site-footer"><a href="privacy.html">Privacidad</a></footer></body></html>
